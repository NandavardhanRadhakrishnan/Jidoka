<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jidoka</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f4;
        --surface: #ffffff;
        --surface-2: #eef0ee;
        --border: #dcdcd8;
        --text: #1c1c1a;
        --text-muted: #6c6c63;
        --accent: #1f6f6b;
        --accent-text: #ffffff;
        --danger: #ad4239;
        --tone-attention: #a8790a;
        --tone-active: #4c5f7a;
        --tone-done: #2f7a4f;
        --tone-failed: #ad4239;
        --radius: 8px;
        --font-sans: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181a;
          --surface: #202124;
          --surface-2: #26282b;
          --border: #35373a;
          --text: #e9e9e6;
          --text-muted: #9b9b93;
          --accent: #4fb3ac;
          --accent-text: #10201f;
          --danger: #dd7d73;
          --tone-attention: #d1a13a;
          --tone-active: #8098c2;
          --tone-done: #5fbb85;
          --tone-failed: #dd7d73;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.45;
      }
      h1, h2, h3 { font-weight: 600; }
      a { color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding-bottom: 16px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }
      header h1 { font-size: 19px; margin: 0; }
      .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

      .signin { display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--text-muted); }
      .provider { display: inline-flex; gap: 6px; align-items: center; }
      .dot, .tone-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
      .dot.on { background: var(--tone-done); }
      .dot.warn { background: var(--tone-attention); }
      .dot.off { background: color-mix(in srgb, currentColor 35%, transparent); }
      .tone-dot.tone-attention { background: var(--tone-attention); }
      .tone-dot.tone-active { background: var(--tone-active); }
      .tone-dot.tone-done { background: var(--tone-done); }
      .tone-dot.tone-failed { background: var(--tone-failed); }

      .link {
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        color: var(--accent);
        text-decoration: underline;
        cursor: pointer;
      }

      /* Buttons: default is the primary action, .secondary is outlined, .link is text-only. */
      button {
        font: inherit;
        cursor: pointer;
        border-radius: var(--radius);
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-text);
        padding: 8px 14px;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
      @media (prefers-reduced-motion: no-preference) {
        button, .card { transition: background-color 100ms ease, border-color 100ms ease; }
      }
      button.secondary:hover:not(:disabled) { background: var(--surface-2); }
      button:not(.secondary):hover:not(:disabled) { filter: brightness(1.08); }

      .board {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding-bottom: 14px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .board::-webkit-scrollbar { height: 8px; }
      .board::-webkit-scrollbar-track { background: transparent; }
      .board::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
      .column { min-width: 250px; flex: 0 0 250px; }
      .column h2 {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin: 0 0 10px;
      }
      .count { color: var(--text-muted); font-weight: 400; }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--border);
        border-radius: var(--radius);
        padding: 9px 11px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .card.tone-attention { border-left-color: var(--tone-attention); }
      .card.tone-active { border-left-color: var(--tone-active); }
      .card.tone-done { border-left-color: var(--tone-done); }
      .card.tone-failed { border-left-color: var(--tone-failed); }
      .card:hover { border-color: var(--accent); }
      .card h3 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
      .card p { font-size: 12.5px; margin: 0; color: var(--text-muted); }
      .card footer { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

      .dialog {
        position: fixed;
        inset: 8% 20%;
        overflow: auto;
        padding: 24px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
        z-index: 10;
      }
      .dialog::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: -1;
      }
      .dialog h2 { font-size: 17px; margin: 0 0 4px; }
      .dialog h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 18px 0 6px; }
      .dialog label { display: block; margin: 12px 0; font-size: 13px; color: var(--text-muted); }
      .dialog input, .dialog textarea {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        font: inherit;
        font-size: 13.5px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .dialog button { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 8px 0; }
      .dialog pre { max-height: 240px; overflow: auto; font-size: 12px; }
      .subject { font-size: 13px; color: var(--text-muted); margin: 0 0 16px; }

      .error { color: var(--danger); font-size: 13px; }
      .meta { font-size: 12.5px; color: var(--text-muted); margin: 4px 0 14px; }
      .body {
        white-space: pre-wrap;
        font: inherit;
        font-size: 13px;
        background: var(--surface-2);
        padding: 10px 12px;
        border-radius: 6px;
        max-height: 200px;
        overflow: auto;
        margin: 12px 0;
      }
      .output pre, .dialog pre {
        white-space: pre-wrap;
        font-family: var(--font-mono);
        font-size: 12.5px;
        background: var(--surface-2);
        padding: 10px 12px;
        border-radius: 6px;
        margin: 4px 0 12px;
      }
      .steps { font-size: 12.5px; color: var(--text-muted); padding-left: 18px; }

      .handoff .target { border-left: 2px solid var(--border); padding-left: 12px; margin-bottom: 14px; }
      .handoff .target strong { display: block; font-size: 13px; margin-bottom: 4px; }
      .handoff code, .handoff pre {
        display: block;
        font-family: var(--font-mono);
        font-size: 12.5px;
        white-space: pre-wrap;
        background: var(--surface-2);
        padding: 8px 10px;
        border-radius: 6px;
        margin: 4px 0;
      }
      .handoff .row { display: flex; gap: 14px; }
      .handoff .link { width: auto; display: inline; padding: 0; margin: 0; }

      .dialog.extensions button { display: inline-block; width: auto; margin: 4px 10px 4px 0; }
      .extension-row { border-top: 1px solid var(--border); padding: 12px 0; }
      .extension-row:first-of-type { border-top: none; }
      .extension-row p { font-size: 12.5px; color: var(--text-muted); margin: 4px 0; }
      .extension-row .connect-form, .extension-row .device-code { margin-top: 8px; }

      @media (max-width: 720px) {
        body { padding: 14px; }
        .dialog { inset: 4%; padding: 18px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
