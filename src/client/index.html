<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jidoka</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; padding: 16px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
      .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .signin { display: flex; gap: 12px; align-items: center; font-size: 12px; opacity: 0.85; }
      .provider { display: inline-flex; gap: 6px; align-items: center; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot.on { background: seagreen; }
      .dot.off { background: color-mix(in srgb, currentColor 35%, transparent); }
      .link { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; }
      .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
      .column { min-width: 240px; flex: 0 0 240px; }
      .column h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.7; }
      .count { opacity: 0.5; }
      .card { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
      .card h3 { font-size: 14px; margin: 0 0 4px; }
      .card p { font-size: 12px; margin: 0; opacity: 0.7; }
      .card footer { font-size: 11px; opacity: 0.5; margin-top: 6px; }
      .dialog { position: fixed; inset: 10% 20%; overflow: auto; padding: 20px; border-radius: 12px; background: Canvas; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
      .dialog label { display: block; margin: 10px 0; }
      .dialog input, .dialog textarea { width: 100%; }
      .dialog button { display: block; width: 100%; text-align: left; padding: 10px; margin: 6px 0; }
      .dialog pre { max-height: 240px; overflow: auto; font-size: 12px; }
      .error { color: crimson; }
      .meta { font-size: 12px; opacity: 0.7; margin: 4px 0 12px; }
      .body { white-space: pre-wrap; font: inherit; font-size: 13px; background: color-mix(in srgb, currentColor 6%, transparent); padding: 10px; border-radius: 8px; max-height: 200px; overflow: auto; }
      .output pre { white-space: pre-wrap; font-size: 13px; margin: 4px 0 12px; }
      .steps { font-size: 12px; opacity: 0.8; }
      .handoff .target { border-left: 2px solid color-mix(in srgb, currentColor 25%, transparent); padding-left: 10px; margin-bottom: 12px; }
      .handoff .target strong { display: block; font-size: 13px; }
      .handoff code, .handoff pre { display: block; font-size: 12px; white-space: pre-wrap; background: color-mix(in srgb, currentColor 6%, transparent); padding: 6px 8px; border-radius: 6px; margin: 4px 0; }
      .handoff .row { display: flex; gap: 12px; }
      .handoff .link { width: auto; display: inline; padding: 0; margin: 0; }
      .dialog h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.7; margin-bottom: 4px; }
      @media (max-width: 720px) { .dialog { inset: 4%; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
